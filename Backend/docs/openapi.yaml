  /payroll/periods:
    get:
      tags: [payroll]
      summary: Payroll periods (latest 24)
      description: >
        Roles CEO, HR_DIRECTOR.
      responses:
        '200':
          description: Periods
        '403': { $ref: '#/components/responses/Error' }
  /payroll/periods/{id}:
    get:
      tags: [payroll]
      summary: One payroll period
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: '1' } }
      responses:
        '200':
          description: Period
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /payroll/periods/{id}/lock:
    post:
      tags: [payroll]
      summary: Lock (chốt) a draft period
      description: >
        DU_THAO -> DA_CHOT. 409 NO_PAYSLIPS when nothing was calculated, 409 ANOMALIES_PENDING (details = the violations) when legal violations exist unless `acknowledgeAnomalies` is true. A locked period can never be recalculated.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: '1' } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                acknowledgeAnomalies: { type: boolean }
      responses:
        '200':
          description: Locked period
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /payroll/periods/{id}/transfer:
    post:
      tags: [payroll]
      summary: Mark a locked period as paid by bank transfer
      description: >
        DA_CHOT -> DA_CHUYEN_KHOAN and every payslip gets paid_date. 409 MISSING_BANK_ACCOUNT (details = employees) until all payslips have bank details.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: '1' } }
      responses:
        '200':
          description: Transferred period
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /payroll/periods/{id}/anomalies:
    get:
      tags: [payroll]
      summary: Anomaly report of a period
      description: >
        Types: OT_OVER_LIMIT (violation, > 40 h), OT_UNAPPROVED, MISSING_BANK, NO_ATTENDANCE. Sorted by severity (Cao, Trung bình, Thấp).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: '1' } }
      responses:
        '200':
          description: Anomalies
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /payroll/periods/{id}/bank-transfer:
    get:
      tags: [payroll]
      summary: Bank transfer batch of a locked period
      description: >
        `totalAmount` equals the period total_net; employees without bank details are listed in `missingBank`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: '1' } }
      responses:
        '200':
          description: { period, status, count, totalAmount, items, missingBank }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /payroll/payslips:
    get:
      tags: [payroll]
      summary: Payslips (paged)
      description: >
        CEO and HR_DIRECTOR see everything including drafts. Everyone else (EMPLOYEE, LINE_MANAGER) sees only their own payslips and only for locked periods. ADMIN and KIOSK get 403.
      parameters:
        - { name: period, in: query, schema: { type: string, example: 2026-09 } }
        - { $ref: '#/components/parameters/page' }
        - { name: limit, in: query, description: Clamped to 1..500, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        '200':
          description: Page of payslips
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /payroll/payslips/{id}:
    get:
      tags: [payroll]
      summary: One payslip
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: '1' } }
      responses:
        '200':
          description: Payslip
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /payroll/me:
    get:
      tags: [payroll]
      summary: The caller's latest 12 published payslips
      responses:
        '200':
          description: Payslips
        '403': { $ref: '#/components/responses/Error' }
  /payroll/calculate:
    post:
      tags: [payroll]
      summary: Calculate (or recalculate) the draft payroll of a month
      description: >
        Roles CEO, HR_DIRECTOR. Includes probation staff and employees who left during the month; days above 22 are capped; progressive personal income tax and capped insurance are applied. 409 PERIOD_LOCKED for a locked or transferred period.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { type: string, example: 2026-09 }
      responses:
        '200':
          description: { period, headcount, totalNet, totalBhxh, totalTax, totalOtHours }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /audit-logs:
    get:
      tags: [audit]
      summary: System audit trail, newest first
      description: >
        Roles CEO and ADMIN. `from` is inclusive, `to` is exclusive. Passwords, token hashes and face data are never
        stored. Salary and personal data are stored as written but redacted when ADMIN reads the log.
      parameters:
        - { name: table, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200':
          description: Page of audit entries
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    limit:
      name: limit
      in: query
      description: Clamped to 1..200
      schema: { type: integer, default: 50, maximum: 200 }
    userId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    empId:
      name: id
      in: path
      required: true
      schema: { type: string, example: NV-0842 }
    contractId:
      name: id
      in: path
      required: true
      schema: { type: string, example: CT-00001 }
    deptId:
      name: id
      in: path
      required: true
      schema: { type: string, example: DEPT-IT }
    posId:
      name: id
      in: path
      required: true
      schema: { type: string, example: POS-MGR }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        details: { description: 'Field errors ([{path, message}]) or extra info' }
    Pagination:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }
    Role:
      type: string
      enum: [CEO, HR_DIRECTOR, LINE_MANAGER, EMPLOYEE, KIOSK, ADMIN]
    AttendanceStatus:
      type: string
      enum: [DUNG_GIO, DI_MUON, VE_SOM, NGHI_PHEP, VANG_KHONG_PHEP, CONG_TAC, NGHI_LE]
    EmployeeStatus:
      type: string
      enum: [DANG_LAM_VIEC, THU_VIEC, TAM_HOAN, DA_NGHI_VIEC]
    ContractType:
      type: string
      enum: [CHINH_THUC, THU_VIEC, THOI_VU, CONG_TAC_VIEN]
    Employee:
      type: object
      description: Snake_case row. Sensitive fields may be absent depending on the caller (see GET /employees).
      properties:
        id: { type: string, example: NV-0842 }
        full_name: { type: string }
        department_id: { type: string, nullable: true }
        department_name: { type: string, nullable: true }
        position_id: { type: string, nullable: true }
        position_name: { type: string, nullable: true }
        job_title: { type: string }
        work_email: { type: string }
        phone_number: { type: string, nullable: true }
        gender: { type: string, enum: [Nam, Nu, Khac], nullable: true }
        joined_date: { type: string, format: date }
        termination_date: { type: string, format: date, nullable: true }
        manager_id: { type: string, nullable: true }
        manager_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/EmployeeStatus' }
        contract_type: { $ref: '#/components/schemas/ContractType' }
        avatar_url: { type: string, nullable: true }
        kpi_score: { type: number }
        attendance_rate: { type: number }
        base_salary: { type: number, description: Sensitive }
        citizen_id: { type: string, nullable: true, description: Sensitive }
        bank_account: { type: string, nullable: true, description: Sensitive }
        bank_name: { type: string, nullable: true, description: Sensitive }
        date_of_birth: { type: string, format: date, nullable: true, description: Sensitive }
        address: { type: string, nullable: true, description: Sensitive }
        termination_reason: { type: string, nullable: true, description: Sensitive }
    EmployeeInput:
      type: object
      description: camelCase input. On create `fullName`, `jobTitle`, `workEmail` and `joinedDate` are required.
      properties:
        id: { type: string, description: "3-20 chars [A-Za-z0-9-]; generated when omitted" }
        fullName: { type: string }
        jobTitle: { type: string }
        workEmail: { type: string }
        joinedDate: { type: string, format: date }
        departmentId: { type: string, nullable: true }
        positionId: { type: string, nullable: true }
        phoneNumber: { type: string, nullable: true }
        citizenId: { type: string, nullable: true, description: 9 or 12 digits }
        dateOfBirth: { type: string, format: date, nullable: true }
        gender: { type: string, enum: [Nam, Nu, Khac], nullable: true }
        address: { type: string, nullable: true }
        baseSalary: { type: number, minimum: 0 }
        contractType: { $ref: '#/components/schemas/ContractType' }
        managerId: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        bankAccount: { type: string, nullable: true }
        bankName: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/EmployeeStatus' }
    Contract:
      type: object
      properties:
        id: { type: string, example: CT-00001 }
        employee_id: { type: string }
        contract_no: { type: string }
        type: { $ref: '#/components/schemas/ContractType' }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        salary: { type: number }
        status: { type: string, enum: [CHO_KY, HIEU_LUC, HET_HAN, DA_CHAM_DUT] }
        file_url: { type: string, nullable: true }
        signed_at: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SessionUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, nullable: true }
        email: { type: string }
        roleCode: { $ref: '#/components/schemas/Role' }
        fullName: { type: string, nullable: true }
        jobTitle: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        departmentId: { type: string, nullable: true }
        departmentName: { type: string, nullable: true }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, nullable: true }
        email: { type: string }
        roleCode: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        lockedUntil: { type: string, format: date-time, nullable: true }
        failedLoginAttempts: { type: integer }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
        fullName: { type: string, nullable: true }
        departmentId: { type: string, nullable: true }
        departmentName: { type: string, nullable: true }
