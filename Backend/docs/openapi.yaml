        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /ot-requests/{id}/reject:
    patch:
      tags: [overtime]
      summary: Reject
      description: >
        Chain: employee -> LINE_MANAGER of the same department -> HR_DIRECTOR. Requests of a LINE_MANAGER or HR_DIRECTOR are approved only by the CEO, a CEO request is approved automatically, the CEO may approve any pending step directly, and nobody acts on their own request.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: OT-2026-001 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
